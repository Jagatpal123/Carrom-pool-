name: Build APK and AAB with App Icon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NPM Packages & Assets Generator
      run: |
        npm install
        npm install -D @capacitor/assets

    - name: Prepare Assets & Generate App Icons
      run: |
        mkdir -p www
        mkdir -p assets
        cp index.html www/index.html
        if [ -f logo.png ]; then
          cp logo.png www/logo.png
          cp logo.png assets/icon.png
          cp logo.png assets/icon-only.png || true
          cp logo.png assets/icon-foreground.png || true
          cp logo.png assets/icon-background.png || true
        fi

    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx @capacitor/assets generate --android || true
        npx cap sync android

    - name: Inject AdMob App ID into AndroidManifest (Prevents Crash)
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # AdMob App ID को AndroidManifest.xml में इंजेक्ट करना ताकि ऐप खुले ही क्रैश न हो
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6302105448775587~3166646352"\/>' "$MANIFEST"

    - name: Build Debug APK (Test Ads + App Logo)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Build Release AAB (Real Ads + App Logo)
      run: |
        sed -i 's/window.IS_RELEASE_BUILD === true/true/g' www/index.html
        npx cap copy android
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease --stacktrace

    - name: Upload Test APK
      uses: actions/upload-artifact@v4
      with:
        name: Carrom-Test-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: Carrom-Release-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
