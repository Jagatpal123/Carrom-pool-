name: Build Signed Carrom APK and Production AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# ==========================================
# 🚀 यहाँ से आसानी से Version बदलें:
# ==========================================
env:
  APP_VERSION_CODE: 4          # हर नए अपडेट पर इसे +1 करें (उदा. 4, 5, 6...)
  APP_VERSION_NAME: "1.0.3"    # आपका मनपसंद वर्जन नाम (उदा. "1.0.3", "1.0.4"...)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps || npm install

    - name: Prepare Output Directory
      run: |
        mkdir -p final_outputs
        mkdir -p www
        cp index.html www/index.html
        if [ -f "logo.png" ]; then
          cp logo.png www/logo.png
        fi

    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Configure Target SDK 36, Dynamic Version, AdMob, Audio Permissions & Icons
      run: |
        # 1. Force Package Name & Dynamic Version Setup
        sed -i 's/applicationId .*/applicationId "com.jagatpal.carrompool"/' android/app/build.gradle
        sed -i "s/versionCode .*/versionCode $APP_VERSION_CODE/" android/app/build.gradle
        sed -i "s/versionName .*/versionName \"$APP_VERSION_NAME\"/" android/app/build.gradle
        
        # 2. SDK Settings
        sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
        echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

        # 3. Inject App Icon Safely
        if [ -f "logo.png" ]; then
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$dir"
            cp logo.png "$dir/ic_launcher.png"
            cp logo.png "$dir/ic_launcher_round.png"
            cp logo.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
          done
        fi

        # 4. Manifest Permissions (Internet, State, Voice Audio Recording)
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

        # 5. MainActivity में WebView को Audio Permission Auto-Grant करना (Clean Override)
        MAIN_ACT="android/app/src/main/java/com/jagatpal/carrompool/MainActivity.java"
        if [ -f "$MAIN_ACT" ]; then
          printf '%s\n' \
            'package com.jagatpal.carrompool;' \
            'import android.os.Bundle;' \
            'import android.webkit.PermissionRequest;' \
            'import android.webkit.WebChromeClient;' \
            'import androidx.core.app.ActivityCompat;' \
            'import android.Manifest;' \
            'import com.getcapacitor.BridgeActivity;' \
            'public class MainActivity extends BridgeActivity {' \
            '    @Override' \
            '    public void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);' \
            '        if (this.bridge != null && this.bridge.getWebView() != null) {' \
            '            this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {' \
            '                @Override' \
            '                public void onPermissionRequest(final PermissionRequest request) {' \
            '                    runOnUiThread(() -> request.grant(request.getResources()));' \
            '                }' \
            '            });' \
            '        }' \
            '    }' \
            '}' > "$MAIN_ACT"
        fi

        # 6. AdMob App ID Setup
        if ! grep -q "ca-app-pub-6302105448775587~3166646352" android/app/src/main/AndroidManifest.xml; then
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6302105448775587~3166646352"\/>' android/app/src/main/AndroidManifest.xml
        fi

    # --- STEP A: TEST AD WALI SIGNED APK BANANA ---
    - name: Prepare, Build and Sign Test-Ad APK
      run: |
        sed -i 's/ca-app-pub-6302105448775587\/1791739528/ca-app-pub-3940256099942544\/1033173712/g' android/app/src/main/assets/public/index.html || true
        sed -i 's/ca-app-pub-6302105448775587\/8722225362/ca-app-pub-3940256099942544\/5224354917/g' android/app/src/main/assets/public/index.html || true
        sed -i 's/isRelease: true/isRelease: false/g' android/app/src/main/assets/public/index.html || true

        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-aligned.apk
        $BUILD_TOOLS_DIR/apksigner sign --ks ../release.keystore --ks-key-alias bhakti --ks-pass pass:Jagatpal@2026 --key-pass pass:Jagatpal@2026 --out ../final_outputs/CarromPool-TestAds.apk app/build/outputs/apk/release/app-aligned.apk

    # --- STEP B: PRODUCTION REAL AD WALI SIGNED AAB BANANA ---
    - name: Prepare, Build and Sign Production AAB
      run: |
        sed -i 's/ca-app-pub-3940256099942544\/1033173712/ca-app-pub-6302105448775587\/1791739528/g' android/app/src/main/assets/public/index.html || true
        sed -i 's/ca-app-pub-3940256099942544\/5224354917/ca-app-pub-6302105448775587\/8722225362/g' android/app/src/main/assets/public/index.html || true
        sed -i 's/isRelease: false/isRelease: true/g' android/app/src/main/assets/public/index.html || true

        cd android
        ./gradlew clean
        ./gradlew bundleRelease

        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.keystore -storepass Jagatpal@2026 -keypass Jagatpal@2026 app/build/outputs/bundle/release/app-release.aab bhakti
        cp app/build/outputs/bundle/release/app-release.aab ../final_outputs/CarromPool-Production-RealAds.aab

    # --- STEP C: UPLOAD ARTIFACTS (APK AUR AAB DONO) ---
    - name: Upload Test APK
      uses: actions/upload-artifact@v4
      with:
        name: CarromPool-TestAds-APK
        path: final_outputs/CarromPool-TestAds.apk

    - name: Upload Production Real-Ad AAB
      uses: actions/upload-artifact@v4
      with:
        name: CarromPool-Production-RealAds-AAB
        path: final_outputs/CarromPool-Production-RealAds.aab
